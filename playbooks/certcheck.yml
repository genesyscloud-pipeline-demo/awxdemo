- name: "Validation: Artifactory Trust & Connectivity"
  hosts: localhost
  connection: local
  tasks:
    - name: "Step 1: Verify Host Resolution"
      shell: "getent hosts jfrog-platform-artifactory-nginx.jfrog-platform.svc"
      register: dns_check

    - name: "Step 2: Check if Certificate is Mounted"
      shell: "ls -l /etc/pki/ca-trust/source/anchors/artifactory.crt"
      register: cert_file_check

    - name: List anchors
      shell: ls -l /etc/pki/ca-trust/source/anchors/

    - name: Check if cert is in bundle
      shell: grep -q "jfrog-platform-artifactory-nginx" /etc/pki/tls/certs/ca-bundle.crt && echo FOUND || echo NOT_FOUND

    - name: "Step 3: Test SSL Handshake (The Real Test)"
      shell: "curl -v https://jfrog-platform-artifactory-nginx.jfrog-platform.svc/artifactory/api/system/ping"
      register: curl_check

    - name: Pause so I can inspect the pod
      shell: sleep 600

    - name: "Final Report"
      debug:
        msg:
          - "DNS: {{ dns_check.stdout }}"
          - "Cert File: {{ cert_file_check.stdout }}"
          - "Connection: {{ curl_check.stderr_lines | select('search', 'SSL certificate verify ok') | list }}"
